<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrega un método de pago — Sistema de Control</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="pagina-login">
    <div class="tarjeta tarjeta-login" style="max-width:420px">
      <h1>Tienes 7 días de prueba gratis</h1>
      <p class="texto-secundario">
        No se te cobra nada ahora. Guarda un método de pago para que, cuando termine
        tu prueba, puedas seguir usando el sistema sin interrupciones — con 50% de
        descuento tu primer mes.
      </p>

      <form id="formTarjeta">
        <label class="campo">
          <span class="campo__etiqueta">Nombre completo del titular *</span>
          <input type="text" id="campoNombreTitular" required>
        </label>
        <label class="campo">
          <span class="campo__etiqueta">Número de tarjeta *</span>
          <div id="campoNumeroTarjeta" class="campo__tarjeta-segura"></div>
        </label>
        <div class="fila-campos">
          <label class="campo">
            <span class="campo__etiqueta">Vencimiento (MM/AA) *</span>
            <div id="campoVencimientoTarjeta" class="campo__tarjeta-segura"></div>
          </label>
          <label class="campo">
            <span class="campo__etiqueta">CVC *</span>
            <div id="campoCVCTarjeta" class="campo__tarjeta-segura"></div>
          </label>
        </div>
        <div class="fila-campos">
          <label class="campo">
            <span class="campo__etiqueta">Tipo de documento *</span>
            <select id="campoTipoDocumento" required>
              <option value="CC">Cédula de ciudadanía</option>
              <option value="CE">Cédula de extranjería</option>
              <option value="NIT">NIT</option>
              <option value="PP">Pasaporte</option>
            </select>
          </label>
          <label class="campo">
            <span class="campo__etiqueta">Número de documento *</span>
            <input type="text" inputmode="numeric" id="campoNumeroDocumento" required>
          </label>
        </div>

        <button type="submit" class="boton boton--primario boton--ancho" id="botonGuardarTarjeta">Guardar método de pago</button>
      </form>
      <p class="texto-secundario" style="text-align:center;margin-top:10px">
        <a href="suscripcion.html">Prefiero hacerlo más tarde desde Suscripción</a>
      </p>
    </div>
  </main>

  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/agregar-metodo-pago.js"></script>
  <script>
    if (!exigirSesion()) { /* exigirSesion ya redirige a login si no hay token */ }
  </script>
</body>
</html>
