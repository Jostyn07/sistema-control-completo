<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Sistema de Control</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tema-panel-oscuro.css">
</head>
<body style="visibility:hidden">

  <nav class="navegacion">
    <a href="./index.html" class="navegacion__enlace">Volver al sistema</a>
  </nav>

  <main class="pagina">
    <header class="pagina__encabezado">
      <h1>Panel de administrador</h1>
      <h2>MRR, clientes y estado del SaaS — solo tú puedes ver esto.</h2>
    </header>

    <div class="selector-periodo" id="selectorPeriodoAdmin" role="group" aria-label="Período de análisis">
      <button type="button" class="boton boton--pequeno" data-periodo="7d">7 días</button>
      <button type="button" class="boton boton--pequeno" data-periodo="30d">30 días</button>
      <button type="button" class="boton boton--pequeno" data-periodo="mes">Este mes</button>
      <button type="button" class="boton boton--pequeno" data-periodo="3m">3 meses</button>
      <button type="button" class="boton boton--pequeno" data-periodo="6m">6 meses</button>
      <button type="button" class="boton boton--pequeno" data-periodo="1y">1 año</button>
    </div>

    <section class="panel-finanzas" id="panelMetricasAdmin">
      <p class="tabla__vacio">Cargando…</p>
    </section>

    <section class="tarjeta">
      <h2>Clientes por plan</h2>
      <div id="resumenPorPlan"><p class="tabla__vacio">Cargando…</p></div>
    </section>

    <section class="tarjeta seccion">
      <h2>Todos los clientes</h2>
      <div id="tablaClientes"><p class="tabla__vacio">Cargando…</p></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // El body arranca oculto (visibility:hidden en el <body>) — solo se
    // muestra si de verdad sos el admin. Para cualquier otra persona,
    // esto redirige antes de que llegue a ver el título ni la
    // estructura de la página: no hay "no tienes acceso", no hay nada.
    (async () => {
      if (!exigirSesion()) return; // ya redirige solo a login si no hay sesión
      try {
        await API.obtener('/api/admin/verificar');
        document.body.style.visibility = 'visible';
        mostrarUsuarioActual();
        iniciarPanelAdmin();
      } catch (err) {
        window.location.replace('/index.html');
      }
    })();
  </script>
</body>
</html>
